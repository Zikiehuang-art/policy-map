const bizNames = {core:"核心政策", battery:"电池业务", solid:"固废业务", hazard:"危废业务", auto:"报废汽车"};
const bizColors = {core:"rgba(245,158,11,0.15)", battery:"rgba(6,182,212,0.15)", solid:"rgba(167,139,250,0.15)", hazard:"rgba(249,115,22,0.15)", auto:"rgba(16,185,129,0.15)"};

function getCountryColor(c) { return c === 'cn' ? '#dc2626' : '#2563eb'; }
function getBorderColor(c) { return c === 'cn' ? '#ef4444' : '#3b82f6'; }

let currentFilter = 'all';

function render(filter) {
  currentFilter = filter;
  let list = policies;
  if (filter === 'cn') list = policies.filter(p => p.country === 'cn');
  else if (filter === 'intl') list = policies.filter(p => p.country === 'intl');
  else if (filter !== 'all') list = policies.filter(p => p.biz === filter);
  
  document.getElementById('count').textContent = list.length;
  
  const cards = document.getElementById('cards');
  if (list.length === 0) {
    cards.innerHTML = '<div class="empty">没有匹配的政策</div>';
    return;
  }
  
  cards.innerHTML = list.map(p => `
    <div class="card" onclick="showDetail('${p.id}')" style="border-left: 3px solid ${getBorderColor(p.country)}">
      <div class="top">
        <div class="emoji">${p.country === 'cn' ? '🇨🇳' : '🇪🇺'}</div>
        <div class="info">
          <div class="name">${p.name}</div>
          <div class="tags">
            <span class="tag ${p.country==='cn'?'tag-cn':'tag-intl'}">${p.level}</span>
            <span class="tag" style="background:${bizColors[p.biz]};color:${'fbbf24'===p.biz?'#fbbf24':p.biz==='battery'?'#22d3ee':p.biz==='solid'?'#a78bfa':p.biz==='hazard'?'#fb923c':'#34d399'}">${bizNames[p.biz]}</span>
          </div>
        </div>
        <div class="arrow">›</div>
      </div>
      <div class="desc">${p.desc}</div>
    </div>
  `).join('');
}

function showDetail(id) {
  const p = policies.find(x => x.id === id);
  if (!p) return;
  
  document.getElementById('detail-title').textContent = p.name;
  document.getElementById('detail-body').innerHTML = `
    <p style="margin-bottom:8px"><span class="tag ${p.country==='cn'?'tag-cn':'tag-intl'}" style="font-size:11px;padding:3px 8px">${p.country==='cn'?'🇨🇳 国内':'🇪🇺 国际'} · ${p.level}</span> <span class="tag" style="background:${bizColors[p.biz]};color:${p.biz==='core'?'#fbbf24':p.biz==='battery'?'#22d3ee':p.biz==='solid'?'#a78bfa':p.biz==='hazard'?'#fb923c':'#34d399'};font-size:11px;padding:3px 8px">${bizNames[p.biz]}</span></p>
    <p style="font-size:12px;color:#64748b;margin-bottom:12px">📅 ${p.pub}</p>
    ${p.full}
  `;
  document.getElementById('detail-links').innerHTML = p.url ? 
    `<a class="link-btn link-source" href="${p.url}" target="_blank">📎 原文全文 →</a>` : '';
  
  document.getElementById('detail').style.display = 'block';
  document.getElementById('detail-overlay').style.display = 'block';
  document.getElementById('detail').scrollTop = 0;
}

function closeDetail() {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('detail-overlay').style.display = 'none';
}

function filter(type, btn) {
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render(type);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// Initial render
render('all');
</script>
</body>
</html>
