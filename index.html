<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>循环经济政策地图</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; overflow: hidden; }
  #header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }

  #header h1 .cn { color: #f87171; } #header h1 .intl { color: #60a5fa; }
  #legend { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 8px; border-radius: 4px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }
  .legend-sep { width: 1px; height: 14px; background: #475569; margin: 0 4px; }
  #container { width: 100vw; height: 100vh; }
  #info-panel { position: fixed; bottom: 20px; right: 20px; max-width: 440px; max-height: 70vh; overflow-y: auto; background: rgba(30,41,59,0.97); border: 1px solid #475569; border-radius: 12px; padding: 18px; display: none; backdrop-filter: blur(12px); z-index: 101; }

  #info-panel h4 { font-size: 13px; margin: 10px 0 4px; }
  #info-panel p { font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 4px; }
  #info-panel ul { padding-left: 16px; margin: 4px 0; }
  #info-panel li { font-size: 12px; color: #cbd5e1; line-height: 1.6; margin-bottom: 2px; }
  #info-panel b { color: #e2e8f0; }
  #info-panel .meta { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 6px; }
  .cn-tag { background: rgba(239,68,68,0.2); color: #f87171; }
  .intl-tag { background: rgba(59,130,246,0.2); color: #60a5fa; }
  .hint { position: fixed; bottom: 24px; left: 24px; font-size: 12px; color: #64748b; z-index: 100; }

</head>
<body>
<div id="header">
  <h1>🔄 循环经济政策地图 · <span class="cn">国内</span>/<span class="intl">国际</span></h1>
  <div id="legend">

<div id="container"></div>

  { from: "ppwr", to: "hj364" }, { from: "hj364", to: "gb30102" },
  { from: "gb30102", to: "gb45090" }, { from: "cn_cu_al", to: "cn_cu_al_import" },
  { from: "crma", to: "eu_battery" },
  // Core → Hazard

  { from: "epr", to: "oecd_oil" },

  { from: "cn_reman", to: "cn_7dept" }, { from: "cn_reman", to: "gb44728" },
  { from: "gb44728", to: "cn_dismantle" },
  // Cross-business
  { from: "cn_battery_recycle", to: "cn_715", dashes: true, color: "#64748b" },
  { from: "cn_energy_storage", to: "cn_device_renewal", dashes: true, color: "#64748b" },
  { from: "gb18597", to: "hj1186", dashes: true, color: "#64748b" },

const container = document.getElementById("container");
const data = { nodes, edges };
const options = {
  physics: {
    solver: "forceAtlas2Based",
    forceAtlas2Based: { gravitationalConstant: -40, centralGravity: 0.008, springLength: 180, springConstant: 0.04, damping: 0.4 },
    stabilization: { iterations: 250 },
  },
  layout: { improvedLayout: true },
  groups: {
    intl_l1: { color: { background: "#1e40af", border: "#1e3a8a", highlight: { background: "#2563eb", border: "#1e40af" } }, borderWidth: 2.5, shape: "box", font: { color: "#bfdbfe", size: 12 } },
    intl_l2: { color: { background: "#2563eb", border: "#1d4ed8", highlight: { background: "#3b82f6", border: "#2563eb" } }, borderWidth: 2, shape: "box", font: { color: "#dbeafe", size: 11 } },

    intl_l4: { color: { background: "#93c5fd", border: "#60a5fa", highlight: { background: "#bfdbfe", border: "#93c5fd" } }, borderWidth: 1.5, shape: "box", font: { color: "#1e3a8a", size: 11 } },

    cn_l2:   { color: { background: "#dc2626", border: "#b91c1c", highlight: { background: "#ef4444", border: "#dc2626" } }, borderWidth: 2, shape: "box", font: { color: "#fee2e2", size: 11 } },
    cn_l3:   { color: { background: "#ef4444", border: "#dc2626", highlight: { background: "#f87171", border: "#ef4444" } }, borderWidth: 2, shape: "box", font: { color: "#fef2f2", size: 11 } },

  edges: { arrows: { to: { enabled: true, scaleFactor: 0.6 } }, smooth: { type: "continuous" }, width: 1.5, color: { color: "#475569", highlight: "#60a5fa" } },
  interaction: { hover: true, tooltipDelay: 200, zoomView: true, dragView: true },
};

const network = new vis.Network(container, data, options);

  cn_cu_al_import: `<p><span class="meta cn-tag">国内 · 多部委</span> <span style="color:#94a3b8">生态环境部/海关总署等六部门 · 2024.11.15实施</span></p>
<h4>🎯 核心要点</h4><ul>

<li>感官检验优先，存疑采用国标或海关行业规范检测</li>
<li>放射性检验<b>强制</b>：辐射剂量率≤天然本底值+0.25μSv/h</li>
</ul>`,

  gb45090: `<p><span class="meta cn-tag">国内 · 国标</span> <span style="color:#94a3b8">国家标准委 · GB/T45090-2024</span></p>

  gb18597: `<p><span class="meta cn-tag">国内 · 国标</span> <span style="color:#94a3b8">生态环境部 · GB18597-2023</span></p>

</ul>`,

  oecd_oil: `<p><span class="meta intl-tag">国际 · 指南</span> <span style="color:#94a3b8">OECD（经济合作与发展组织）</span></p>

  gb17145: `<p><span class="meta cn-tag">国内 · 国标</span> <span style="color:#94a3b8">国家标准委 · GB/T17145-2024</span></p>

  cn_oil_tax: `<p><span class="meta cn-tag">国内 · 部委</span> <span style="color:#94a3b8">财政部/税务总局 · 财税〔2023〕69号</span></p>

  cn_715: `<p><span class="meta cn-tag">国内 · 国务院</span> <span style="color:#94a3b8">国务院令第715号 · 2019.6.1实施</span></p>

network.on("click", function(params) {
  const panel = document.getElementById("info-panel");
  if (params.nodes.length > 0) {
    const nodeId = params.nodes[0];
    const node = nodes.get(nodeId);
    const desc = descriptions[nodeId] || "";
    const title = node.label.replace(/\n/g, " ");
    const count = network.getConnectedNodes(nodeId).length;
    document.getElementById("info-title").innerHTML = title;
    const countryTag = node.group.startsWith("cn") ? '<span class="meta cn-tag">🇨🇳 国内</span>' : '<span class="meta intl-tag">🇪🇺 国际</span>';
    const bizMap = {"core": "核心政策", "battery": "电池业务", "solid": "固废业务", "hazard": "危废业务", "auto": "报废汽车"};
const bizTagMap = {"core": '<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin-right:6px;background:rgba(245,158,11,0.2);color:#fbbf24">🌐 核心政策</span>',"battery":'<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin-right:6px;background:rgba(6,182,212,0.2);color:#22d3ee">🔋 电池业务</span>',"solid":'<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin-right:6px;background:rgba(167,139,250,0.2);color:#a78bfa">🏭 固废业务</span>',"hazard":'<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin-right:6px;background:rgba(249,115,22,0.2);color:#fb923c">⚠️ 危废业务</span>',"auto":'<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin-right:6px;background:rgba(16,185,129,0.2);color:#34d399">🚗 报废汽车</span>'};
const bizForNode = {"ceap": "core", "espr": "core", "greenclaims": "core", "ppwr": "core", "elv": "core", "cn_waste": "core", "eu_battery": "battery", "adr": "battery", "epr": "battery", "cn_battery_recycle": "battery", "cn_energy_storage": "battery", "gb33598": "battery", "hj1186": "battery", "cn_carbon_lca": "battery", "cn_battery_comprehensive": "battery", "crma": "solid", "cn_device_renewal": "solid", "hj364": "solid", "gb30102": "solid", "cn_cu_al": "solid", "cn_cu_al_import": "solid", "gb45090": "solid", "gb18597": "hazard", "oecd_oil": "hazard", "gb17145": "hazard", "cn_oil_tax": "hazard", "iscc": "hazard", "cn_715": "auto", "cn_reman": "auto", "cn_7dept": "auto", "gb44728": "auto", "cn_dismantle": "auto"};
const bizTag = bizTagMap[bizForNode[nodeId]] || "";
document.getElementById("info-body").innerHTML = bizTag + countryTag + desc + (sourceLinks[nodeId] || "") + `<p style="margin-top:10px;font-size:11px;color:#64748b;border-top:1px solid #334155;padding-top:8px;">🔗 关联节点: ${count} 个</p>`;
    panel.style.display = "block";
  } else {
    panel.style.display = "none";
  }
});

window.addEventListener("resize", () => network.fit({ animation: true }));
setTimeout(() => network.fit({ animation: true }), 1500);
</script>
